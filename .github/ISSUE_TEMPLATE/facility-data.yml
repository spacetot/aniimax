name: Submit game data
description: Share recipe or item data for a facility, or correct a value we have wrong.
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the calculator accurate! One facility per submission, please.

        Copy numbers exactly as the game shows them. Screenshots are optional but help us double-check.
        You don't need to worry about formatting item names; we'll convert them.

  - type: dropdown
    id: submission-type
    attributes:
      label: What are you submitting?
      options:
        - New data (a facility or items the calculator doesn't have yet)
        - Correction (a value in the calculator is wrong)
    validations:
      required: true

  - type: dropdown
    id: facility
    attributes:
      label: Facility
      description: Pick "Other" if it isn't listed, and name it in the next field.
      options:
        - Farmland
        - Woodland
        - Mine
        - Well
        - Tidewhisper Sandcastle
        - Dewy House
        - Nimbus Bed
        - Starfall Hammock
        - Floral Windmill
        - Carousel Mill
        - Crafting Table
        - Claw Game Cooker
        - Jukebox Dryer
        - Simmering Pot
        - Phonolfactory Table
        - Bouncy Brew Keg
        - Woodworking Bench
        - Chimney Kiln
        - Joy Wheel Loom
        - Blazing Stove
        - Pickling Jar
        - Dance Pad Polisher
        - Heat Furnace / Cooling Unit / Sunlamp
        - Other
    validations:
      required: true

  - type: input
    id: other-facility
    attributes:
      label: Facility name (if Other)
    validations:
      required: false

  - type: input
    id: homeland-level
    attributes:
      label: Homeland level this facility unlocks at
      description: Leave blank if you're not sure.
      placeholder: "e.g. 6"
    validations:
      required: false

  - type: textarea
    id: items
    attributes:
      label: Items
      description: |
        One item per line, with whatever you can see: its level, what goes into it, the workload (or grow time for crops and trees), how many it makes, and what it sells for. Mention a module or environment if it needs one. Pasting a table from a spreadsheet works too.
      placeholder: |
        Plain Rice Porridge: level 1, 2 milled rice + 5 well water, workload 108, makes 1, sells for 660
        Rose Concentrate: level 2, 12 rose + 8 well water, workload 135, makes 1, sells for 770
        Strawberry: level 5, grows in 40 min, makes 8, sells for 61, seed costs 32, needs Cool
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Anything else?
      description: Byproducts (like Wood Blocks or Mineral Sand), which value is wrong for a correction, or anything that surprised you.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop screenshots of the in-game recipe or item screens here.
    validations:
      required: false
